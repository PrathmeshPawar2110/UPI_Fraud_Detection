name: CI/CD

# Tests on every push and pull request; deploys to Vercel only when the tests pass.
#   push to main   -> production deployment
#   pull request   -> preview deployment (URL shown on the run)
# Deployment needs three repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (see "Deployment" in README.md). Without them, the deploy job is skipped with a notice.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run tests (API, rules, predictor parity with LightGBM, Vercel entry point)
        working-directory: backend
        run: python -m pytest -q
      - name: Deployed function runs with runtime dependencies only
        run: |
          python -m venv /tmp/runtime
          /tmp/runtime/bin/pip install -q -r requirements.txt
          /tmp/runtime/bin/python - <<'EOF'
          import runpy
          app = runpy.run_path("api/index.py")["app"]
          from app.fraud import score
          from app.schemas import Transaction
          res = score(Transaction(type="TRANSFER", amount=181000, hour=3, sender_balance_before=181000))
          assert res["risk"] == "high", res
          print("ok:", res["risk"], round(res["probability"], 4), len(app.openapi()["paths"]), "API paths")
          EOF

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: OCR parser tests
        run: npm test
      - name: Production build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PROD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Skipping deployment: add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID as repository secrets."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Install Vercel CLI
        if: steps.secrets.outputs.ok == 'true'
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        if: steps.secrets.outputs.ok == 'true'
        run: vercel pull --yes --environment=${{ env.PROD == 'true' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.secrets.outputs.ok == 'true'
        run: vercel build ${{ env.PROD == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        run: |
          url=$(vercel deploy --prebuilt ${{ env.PROD == 'true' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test the live API
        if: steps.secrets.outputs.ok == 'true'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/info.json -w '%{http_code}' "$url/api/model-info") && [ "$code" = 200 ] && break
            sleep 5
          done
          [ "$code" = 200 ] || { echo "model-info returned $code"; cat /tmp/info.json; exit 1; }
          curl -sf -X POST "$url/api/predict" -H 'Content-Type: application/json' \
            -d '{"type":"TRANSFER","amount":181000,"hour":3,"sender_balance_before":181000}' | tee /tmp/predict.json
          grep -q '"risk":"high"' /tmp/predict.json
